name: Hourly ESPN League Archive
on:
  workflow_dispatch:
  schedule:
    # Two opportunities per hour; sync script is idempotent.
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: espn-league-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Sync ESPN (retry transient network failures)
        run: |
          for attempt in 1 2 3; do
            python scripts/sync_espn_league.py && exit 0
            echo "Sync attempt $attempt failed; retrying..."
            sleep 30
          done
          exit 1
      - name: Save separate archive
        run: |
          git config user.name "espn-league-bot"
          git config user.email "espn-league-bot@users.noreply.github.com"
          git add league_archive/
          if ! git diff --cached --quiet; then
            git commit -m "Update ESPN league archive"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 10
            done
            exit 1
          fi
