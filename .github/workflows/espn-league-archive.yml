name: Hourly ESPN League Archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_espn_league.py'
      - 'scripts/test_espn_sync.py'
      - '.github/workflows/espn-league-archive.yml'
  schedule:
    # Two opportunities per hour; sync script is idempotent.
    - cron: '17,47 * * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: espn-league-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Validate scoring and roster invariants (offline)
        run: python -m unittest discover -s scripts -p 'test_espn_sync.py' -v
      - name: Sync ESPN (retry transient network failures)
        run: |
          for attempt in 1 2 3; do
            python scripts/sync_espn_league.py && exit 0
            echo "Sync attempt $attempt failed; retrying..."
            sleep 30
          done
          exit 1
      - name: Alert on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::ESPN league sync failed; inspect workflow run ${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/issues" -f title="ESPN sync failure — run ${{ github.run_id }}" -f body="The ESPN league archive workflow failed. Inspect https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Previous committed archive remains available." || true
      - name: Save separate archive
        run: |
          git config user.name "espn-league-bot"
          git config user.email "espn-league-bot@users.noreply.github.com"
          git add league_archive/
          if ! git diff --cached --quiet; then
            git commit -m "Update ESPN league archive"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            # The generated XLSX is binary and cannot be rebased; restart from
            # the newest committed archive and regenerate the snapshot.
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_espn_league.py
            git add league_archive/
            git diff --cached --quiet && exit 0
            git commit -m "Update ESPN league archive (retry)"
              sleep 10
            done
            exit 1
          fi
